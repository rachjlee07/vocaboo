<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vocaboo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vocaboo">
<meta name="theme-color" content="#5B3FD9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first study app. Violet hero panels with a curved edge, white rounded cards on a lavender ground, a bottom tab bar; focus mode (no tabs) for training and quizzes. */
:root{
  --bg:#F3F1FA; --card:#FFFFFF; --ink:#1E1638; --muted:#6E6787; --line:#E7E3F3;
  --violet:#5B3FD9; --violet-2:#7B61FF; --violet-deep:#3A23A6; --violet-soft:#ECE8FF;
  --sun:#FFC93C; --sun-soft:#FFF4D6; --sun-ink:#5A3D00;
  --coral:#FF6B5B; --coral-soft:#FFE6E2; --coral-ink:#B3291B;
  --mint:#1FA98F; --mint-soft:#DBF5EE; --mint-ink:#0E6B5A;
  --sky:#3F82F2; --sky-soft:#E2EDFF;
  --f-display:"Nunito", "Noto Sans KR", system-ui, sans-serif;
  --f-body:"Nunito", "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --shadow:0 12px 28px -14px rgba(60,40,150,.28), 0 2px 6px -2px rgba(60,40,150,.10);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
#app.focus{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
#app.wide{max-width:1120px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance;line-height:1.15}
h1{font-size:30px;font-weight:900} h2{font-size:21px;font-weight:900} h3{font-size:17px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card.flat{box-shadow:none;border:1.5px solid var(--line)}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:999px;min-height:48px;padding:0 20px;color:var(--ink);background:var(--violet-soft)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.primary{background:var(--violet);color:#fff;box-shadow:0 8px 18px -8px rgba(91,63,217,.7)}
button.sun{background:var(--sun);color:var(--sun-ink)}
button.big{min-height:58px;font-size:18px;width:100%}
button.ghost{background:transparent;color:var(--violet);padding:0 8px;min-height:40px}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
button.round{width:52px;min-width:52px;padding:0;display:inline-grid;place-items:center}
button.round svg,button svg{width:22px;height:22px;flex:none}
button.icon-l{display:inline-flex;align-items:center;justify-content:center;gap:8px}
input[type=text],input[type=password],input[type=number],select{font:inherit;font-size:20px;width:100%;min-height:58px;padding:0 18px;border-radius:18px;border:2px solid var(--line);background:#fff;color:var(--ink)}
input:focus{border-color:var(--violet);outline:none}
input.answer{font-family:var(--f-mono);font-size:24px;letter-spacing:.04em}
select,input[type=number]{font-size:16px;min-height:46px;border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:800;background:var(--violet-soft);color:var(--violet)}
.pill.good{background:var(--mint-soft);color:var(--mint-ink)} .pill.bad{background:var(--coral-soft);color:var(--coral-ink)} .pill.sun{background:var(--sun-soft);color:var(--sun-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:12px;padding:6px 11px;background:var(--bg);font-size:15px;font-weight:700}
.chip.m{background:var(--mint-soft);color:var(--mint-ink)}
.notice{border-radius:18px;padding:14px 16px;background:var(--sun-soft);color:var(--sun-ink);font-weight:700}
.notice.info{background:var(--violet-soft);color:var(--violet-deep)}
.notice.bad{background:var(--coral-soft);color:var(--coral-ink)}
/* hero */
.hero{position:relative;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:22px max(20px,env(safe-area-inset-left,0px)) 64px;background:radial-gradient(120% 90% at 85% 0%,#8C74FF 0%,var(--violet) 45%,var(--violet-deep) 100%);color:#fff;border-radius:0 0 50% 50% / 0 0 44px 44px;overflow:hidden}
.hero h1{color:#fff}.hero .muted{color:rgba(255,255,255,.78)}
.hero .deco{position:absolute;border-radius:50%;opacity:.16;background:#fff}
.hero-row{display:flex;align-items:center;gap:16px;position:relative}
.streak-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-weight:900}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:-46px;position:relative;z-index:1}
.wday{background:#fff;border-radius:16px;padding:8px 0 10px;text-align:center;font-size:11px;font-weight:800;color:var(--muted);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px}
.wday i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-style:normal;font-size:13px}
.wday.done i{background:var(--sun);color:var(--sun-ink)} .wday.today{outline:2.5px solid var(--violet)}
/* path */
.path{display:flex;flex-direction:column;gap:14px;position:relative;padding-left:30px}
.path::before{content:"";position:absolute;left:10px;top:24px;bottom:24px;border-left:2.5px dashed var(--line)}
.step{position:relative}
.step .dot{position:absolute;left:-30px;top:26px;width:22px;height:22px;border-radius:50%;background:#fff;border:2.5px solid var(--line)}
.step.now .dot{background:var(--coral);border-color:var(--coral);box-shadow:0 0 0 5px var(--coral-soft)}
.step.done .dot{background:var(--mint);border-color:var(--mint)}
.step-card{display:flex;gap:12px;align-items:stretch;background:#fff;border-radius:24px;box-shadow:var(--shadow);overflow:hidden;text-align:left;width:100%;padding:0;min-height:120px;font-weight:600}
.step-card:disabled{opacity:.6}
.step-card .txt{flex:1;padding:16px 4px 16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.step-card .txt h3{font-size:19px}
.step-card .meta{font-size:13px;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step-card .art{width:118px;flex:none;display:grid;place-items:center}
.step-card .art svg{width:100%;height:100%}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{background:none;border-radius:16px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);padding:0}
.tabbar button[aria-current=page]{color:var(--violet)}
.tabbar svg{width:24px;height:24px}
/* focus screens */
.topbar{display:flex;align-items:center;gap:12px;padding-top:12px}
.topbar .bar{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.topbar .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet-2),var(--violet));transition:width .35s}
.topbar .count{font-weight:900;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.x{width:44px;min-width:44px;min-height:44px;padding:0;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center}
.word{font-family:var(--f-display);font-size:46px;font-weight:900;line-height:1;word-break:break-word;letter-spacing:-.02em}
.ipa{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.sense{display:flex;gap:10px;align-items:baseline}
.pos-tag{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--violet);background:var(--violet-soft);border-radius:8px;padding:2px 7px;flex:none}
.ko{font-size:21px;font-weight:700}
.def{font-size:16px;color:var(--muted)}
.ex{display:flex;gap:10px;align-items:flex-start}
.ex p{font-size:17px;padding-top:12px}
mark{background:transparent;color:inherit;font-weight:800;text-decoration:underline;text-decoration-color:var(--sun);text-decoration-thickness:5px;text-underline-offset:3px;text-decoration-skip-ink:none}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.syl{font-family:var(--f-mono);font-size:18px;min-height:44px;border:0;cursor:pointer;border-radius:14px;padding:0 14px;background:var(--violet-soft);color:var(--violet);display:inline-grid;place-items:center;font-weight:700}
.syl.stress{background:var(--violet);color:#fff}
.label{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.q-prompt{font-size:25px;font-weight:800;line-height:1.3}
.opts{display:grid;gap:10px}
.opt{text-align:left;min-height:60px;font-size:18px;font-weight:700;border-radius:18px;background:#fff;border:2px solid var(--line);padding:0 18px}
.opt.sel{border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
textarea:focus{border-color:var(--violet);outline:none}
.opt.right{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink)}
.opt.wrong{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink)}
.fb{border-radius:18px;padding:14px 16px;font-weight:800}
.fb.good{background:var(--mint-soft);color:var(--mint-ink)} .fb.bad{background:var(--coral-soft);color:var(--coral-ink)}
.diff{font-family:var(--f-mono);font-size:20px;letter-spacing:.05em;display:flex;flex-direction:column;gap:2px}
.diff .x{background:var(--coral);color:#fff;border-radius:4px;padding:0 1px;width:auto;min-width:0;min-height:0;box-shadow:none;display:inline}
.hint{font-family:var(--f-mono);font-size:20px;letter-spacing:.3em;color:var(--muted)}
.mic{width:96px;height:96px;min-height:96px;border-radius:50%;padding:0;align-self:center;display:grid;place-items:center;background:var(--coral);color:#fff;box-shadow:0 14px 28px -10px rgba(255,107,91,.8)}
.mic svg{width:40px;height:40px}
.mic.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,91,.55)}50%{box-shadow:0 0 0 18px rgba(255,107,91,0)}}
.dots{display:flex;gap:6px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--mint)}
/* result */
.result-hero{border-radius:32px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;background:radial-gradient(120% 100% at 50% 0%,#8C74FF,var(--violet) 55%,var(--violet-deep))}
.result-hero.bad{background:radial-gradient(120% 100% at 50% 0%,#FF9A7E,var(--coral) 60%,#D9473A)}
.result-hero h1{color:#fff}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:#fff;border-radius:20px;padding:14px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--f-display);font-size:26px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:700}
.tile .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center}
.tile .ic svg{width:20px;height:20px}
.seg{display:inline-flex;background:var(--violet-soft);border-radius:999px;padding:4px;gap:4px}
.seg button{min-height:36px;font-size:14px;background:transparent;color:var(--violet);padding:0 14px}
.seg button[aria-pressed=true]{background:var(--violet);color:#fff}
.chart svg{width:100%;height:auto;display:block}
.hrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.hrow .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center}.hrow .ic svg{width:18px;height:18px}
.hbar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}.hbar i{display:block;height:100%;border-radius:99px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal span{aspect-ratio:1;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);max-width:100%}
.cal span.on{background:var(--sun);color:var(--sun-ink)} .cal span.part{background:var(--violet-soft);color:var(--violet)} .cal span.t{outline:2px solid var(--violet)}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-radius:0;width:100%;text-align:left;font-weight:600;min-height:56px}
.list-row:last-child{border-bottom:0}
/* teacher */
.t-head{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:22px max(20px,env(safe-area-inset-left,0px)) 26px;background:radial-gradient(120% 120% at 90% 0%,#8C74FF,var(--violet) 50%,var(--violet-deep));color:#fff;border-radius:0 0 32px 32px;display:flex;flex-direction:column;gap:14px}
.t-head h1{color:#fff}.t-head .muted{color:rgba(255,255,255,.75)}
.t-head button{background:rgba(255,255,255,.16);color:#fff}
.t-head button[aria-pressed=true]{background:#fff;color:var(--violet)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:900}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--f-mono)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:800;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
pre.report{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:#fff;border-radius:18px;padding:14px;max-height:360px;overflow:auto;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;z-index:40;max-width:90vw;text-align:center}
.splash{min-height:70vh;display:grid;place-items:center;text-align:center}

.lvl{display:flex;align-items:center;gap:8px;margin-top:2px}
.lv-badge{background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:3px 10px;font-weight:900;font-size:13px;flex:none}
.lv-bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;min-width:60px}
.card .lv-bar{background:var(--bg)}
.lv-bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.lv-num{font-size:12px;font-weight:800;opacity:.85;flex:none}
.xpfly{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--sun);color:var(--sun-ink);font-weight:900;padding:8px 16px;border-radius:999px;z-index:60;animation:xpf 1.3s ease-out forwards;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);pointer-events:none}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.cel{position:fixed;inset:0;z-index:70;background:rgba(30,22,56,.55);display:grid;place-items:center;padding:24px;overflow:hidden}
.cel-card{background:#fff;border-radius:28px;padding:26px 22px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .35s ease-out;position:relative;z-index:2}
.cel-icon{font-size:64px;line-height:1}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.cf{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards;z-index:1}
@keyframes fall{to{top:105%;transform:rotate(540deg)}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{border-radius:18px;padding:12px 8px;text-align:center;background:var(--bg);display:flex;flex-direction:column;gap:4px;align-items:center;opacity:.55}
.badge.on{opacity:1;background:var(--sun-soft)}
.badge .bi{font-size:30px;line-height:1}
.badge b{font-size:13px;line-height:1.2}.badge span{font-size:11px;color:var(--muted);line-height:1.25}
.blank{display:inline-block;border-bottom:3px solid var(--violet);color:transparent;min-width:3em;letter-spacing:-2px}
.story-hero{border-radius:28px;padding:22px 20px;color:#fff;background:radial-gradient(120% 120% at 90% 0%,#FF9A7E,var(--coral) 55%,#D9473A);display:flex;flex-direction:column;gap:6px}
.story-hero h1{color:#fff}
.story-text{font-size:19px;line-height:1.7;margin:0;flex:1}
.story-ko{font-size:15px;line-height:1.6}
.sword{font:inherit;font-weight:800;color:var(--violet);background:var(--violet-soft);border:0;border-radius:8px;padding:0 4px;min-height:0;line-height:inherit;cursor:pointer}
.tour{position:fixed;inset:0;z-index:80}
.tour-hole{position:fixed;border-radius:22px;box-shadow:0 0 0 9999px rgba(30,22,56,.62);outline:3px solid var(--sun);pointer-events:none;transition:all .2s}
.tour-card{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:480px;margin:0 auto;background:#fff;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 40px -12px rgba(0,0,0,.45)}
.dmiss{color:var(--coral-ink);background:var(--coral-soft);border-radius:4px;padding:0 3px;font-weight:800}
.slot-bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:4px;margin-right:8px}
.slot-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet-2),var(--violet))}
.slot-pct{font-size:12px;font-weight:900;color:var(--violet)}
.step-card.complete{background:linear-gradient(135deg,#E6FAF3,#C9F2E3);box-shadow:0 10px 24px -14px rgba(31,169,143,.6)}
.step-card.complete h3{color:var(--mint-ink)}
.step-card.complete .slot-bar i{background:var(--mint)}
.step-card.complete .slot-pct{color:var(--mint-ink)}
.done-art{font-size:54px;background:rgba(255,255,255,.5)}
.rw{border-radius:6px;padding:0 2px;transition:background .2s}.rw.on{background:var(--mint-soft);color:var(--mint-ink)}.rw.miss{background:var(--coral-soft);color:var(--coral-ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.gear{position:fixed;z-index:60;top:calc(env(safe-area-inset-top) + 12px);right:max(12px,calc((100vw - 560px)/2 + 12px));width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(30,22,56,.18);font-size:22px;display:grid;place-items:center}
.menu-wrap{position:fixed;inset:0;z-index:80;background:rgba(30,22,56,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 64px) 16px 16px}
.menu-sheet{background:#fff;border-radius:24px;padding:16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;box-shadow:0 18px 40px rgba(30,22,56,.3)}
.menu-item{justify-content:flex-start;text-align:left;background:var(--violet-soft);color:var(--ink);min-height:52px;font-size:17px;padding:0 16px;border-radius:16px;width:100%}
.menu-item.danger{background:#FFE6E2;color:#B3261E}
.lvscale{display:flex;flex-direction:column;gap:6px;padding:16px 4px 2px}
.lvtrack{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,#DBF5EE,#ECE8FF 50%,#FFE6E2)}
.lvrange{position:absolute;top:0;bottom:0;background:rgba(91,63,217,.28);border-radius:999px}
.lvdot{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#5B3FD9;border:4px solid #fff;box-shadow:0 2px 8px rgba(30,22,56,.3)}
.lvgoal{position:absolute;top:-22px;margin-left:-8px;color:#E0A100;font-size:16px}
.lvlabels{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted)}

button.big.sel{background:var(--violet-soft)}
.word{word-break:keep-all;overflow-wrap:normal}
</style>
</head>
<body>
<div id="app"><div class="splash"><div class="stack" style="align-items:center"><h2>Vocaboo</h2><p class="muted">Loading…</p><button id="bootReload" class="primary" hidden onclick="location.reload()">Taking too long? Reload</button></div></div></div>
<script>setTimeout(function(){var b=document.getElementById("bootReload");if(b)b.hidden=false;},6000);</script>
<div id="tabs"></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="words.js"></script>
<script src="stories.js"></script>
<script src="app.js"></script>
<script type="module" src="fb.js"></script>
</body>
</html>
