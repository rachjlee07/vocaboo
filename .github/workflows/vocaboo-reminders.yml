name: Vocaboo reminders
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which reminder to send now (morning, afternoon, evening)"
        default: "afternoon"
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12.7.0 --no-save --prefix reminders
      - run: node reminders/send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ secrets.APP_URL }}
          SLOT: ${{ github.event.inputs.slot }}
